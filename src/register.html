<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./styles/output.css" rel="stylesheet">
</head>
<body class="font-poppins">
    <div class="bg-gradient-to-b from-blue-light to-blue-dark py-6 h-screen flex flex-col items-center justify-center">
        <h1 class="text-3xl font-bold text-white mb-6">
          B-Laundry
        </h1>
        <div class="flex flex-col items-center justify-center py-4 mx-auto lg:py-0">
            <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0">
                <div class="p-4 space-y-2 md:space-y-4 sm:p-6">
                    <h1 class="text-lg font-bold leading-tight text-center tracking-tight text-black md:text-xl">
                        Register
                    </h1>
                    <form class="space-y-2 md:space-y-4" action="#">
                        <div>
                            <label for="email" class="block mb-1 text-sm font-medium text-black">Nama</label>
                            <input type="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="name@company.com" required="">
                        </div>
                        <div>
                            <label for="password" class="block mb-1 text-sm font-medium text-black">Kata Sandi</label>
                            <input type="password" name="password" id="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" required="">
                        </div>
                        <div>
                            <label for="confirm-password" class="block mb-1 text-sm font-medium text-black">Konfirmasi Kata Sandi</label>
                            <input type="confirm-password" name="confirm-password" id="confirm-password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" required="">
                        </div>
                        <button type="submit" class="w-full text-white bg-blue-dark hover:bg-blue-light focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Create an account</button>
                        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                            Already have an account? <a href="./index.html" class="font-medium text-primary-600 hover:underline dark:text-primary-500">Login here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- kajshdkjas -->
</body>
</html>
