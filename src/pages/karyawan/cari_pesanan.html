                            <p class="font-semibold text-sm status text-blue-500">Sedang diperoses</p>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
         function updateStatus(button) {
            // Define the statuses and corresponding colors
            const statuses = [
                { text: "Belum diterima", color: "text-red-500" },
                { text: "Belum diproses", color: "text-orange-500" },
                { text: "Sedang diproses", color: "text-blue-500" },
                { text: "Selesai", color: "text-green-500" },
            ];

            // Find the status element within the same container
            const statusElement = button
                .closest(".flex")
                .querySelector(".status");

            // Get the current status text
            const currentStatus = statusElement.textContent;

            // Find the current status index
            const currentIndex = statuses.findIndex(
                (status) => status.text === currentStatus
            );

            // Calculate the next status index
            const nextIndex = (currentIndex + 1) % statuses.length;

            // Update the status text and color
            statusElement.textContent = statuses[nextIndex].text;

            // Remove the previous color class and add the new one
            statuses.forEach((status) => {
                statusElement.classList.remove(status.color);
            });
            statusElement.classList.add(statuses[nextIndex].color);
        }
    </script>
