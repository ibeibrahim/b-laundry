<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../../styles/output.css" rel="stylesheet">
</head>
<body class="font-poppins">
    <nav class="bg-blue-dark border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 ">
                <li>
                <a href="../../home_karyawan.html" class="block py-2 px-3 md:p-0 text-xl font-semibold text-white bg-blue-dark rounded hover:text-blue-light md:bg-transparent" aria-current="page">Beranda</a>
                </li>
                <li>
                <a href="../../account_karyawan.html" class="block py-2 px-3 md:p-0 text-xl font-semibold text-white rounded hover:bg-gray-100 hover:text-blue-light md:hover:bg-transparent">Akun Saya</a>
                </li>
            </ul>
            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button onclick="location.href='../../index.html'" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">Keluar</button>
                <button data-collapse-toggle="navbar-cta" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 " aria-controls="navbar-cta" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    <!-- Section 1 -->
    <div class="relative bg-cover bg-karyawan min-h-screen bg-center bg-blend-multiply bg-blue-500 justify-center items-center flex flex-col">
        <div class="absolute inset-x-0 top-0 bg-gradient-to-b from-blue-dark to-transparent h-24 w- z-20">
        </div>
        <div class="absolute inset-x-0 top-0 bg-white opacity-15 h-full w- z-10">
        </div>
        <h1 class="text-5xl text-shadow shadow-black font-bold leading-tight text-center tracking-tight text-white md:text-5xl z-20">
            Buat Pesanan
        </h1>
        <div class="w-1/2 mt-8 z-20">
            <!-- {/* Profile Form Card */} -->
            <form class="bg-white rounded-xl shadow-lg p-6 mb-8" action="#">
                <div class="space-y-6">
                    <!-- {/* Weight Field */} -->
                    <div>
                        <label class="block text-xl text-center font-medium text-gray-800 mb-2">
                            Nama Pelanggan
                        </label>
                        <input 
                            type="text" 
                            class="w-full border-2 bg-transparent border-blue-500 rounded-full shadow-lg p-4 text-center text-lg"
                            placeholder="Masukkan nama"
                        />
                    </div>
                    <!-- {/* Weight Field */} -->
                    <div>
                        <label class="block text-xl text-center font-medium text-gray-800 mb-2">
                            Berat (Kg)
                        </label>
                        <input 
                            type="number" 
                            class="w-full border-2 bg-transparent border-blue-500 rounded-full shadow-lg p-4 text-center text-lg"
                            placeholder="Masukkan berat"
                        />
                    </div>
                    <!-- {/* Weight Field */} -->
                    <div>
                        <label class="block text-xl text-center font-medium text-gray-800 mb-2">
                            Notasi Cucian
                        </label>
                        <input 
                            type="text" 
                            class="w-full border-2 bg-transparent border-blue-500 rounded-full shadow-lg p-4 text-center text-lg"
                            placeholder="Masukkan notasi"
                        />
                    </div>
                    <!-- Perfume Selection -->
                    <div class="space-y-2 text-black">
                        <div class="grid grid-cols-4 gap-4">
                            <p class="text-lg font-medium">Parfum:</p>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="perfume" class="w-4 h-4" />
                            <span>Akasia</span>
                            </label>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="perfume" class="w-4 h-4" />
                            <span>Molto</span>
                            </label>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="perfume" class="w-4 h-4" />
                            <span>Kispray</span>
                            </label>
                        </div>
                    </div>

                    <!-- Duration Selection -->
                    <div class="space-y-2 text-black">
                        <div class="grid grid-cols-4 gap-4">
                            <p class="text-lg font-medium">Durasi:</p>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="duration" class="w-4 h-4" />
                            <span>1 Day</span>
                            </label>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="duration" class="w-4 h-4" />
                            <span>2 Day</span>
                            </label>
                            <label class="flex items-center space-x-2">
                            <input type="radio" name="duration" class="w-4 h-4" />
                            <span>3 Day</span>
                            </label>
                        </div>
                    </div>    

                    <!-- Address -->
                    <div class="space-y-2 mt-4">
                        <p class="text-lg text-black text-center font-medium">Total Harga</p>
                        <input 
                            type="text" 
                            class="w-full border-2 bg-transparent border-blue-500 rounded-full shadow-lg p-4 text-center text-lg"
                            defaultValue="Rp 0"
                        />
                    </div>

                    <!-- {/* Action Buttons */} -->
                    <div class="space-y-4 mt-4">
                        <button type="button" onclick="my_modal_1.showModal()" class="w-full bg-blue-500 text-white py-4 rounded-xl font-medium hover:bg-blue-600 transition-colors">
                            Buat Pesanan
                        </button>
                    </div>
                </div>
            </form>
            <dialog id="my_modal_1" class="modal">
                <div class="modal-box bg-blue-light text-white">
                    <h3 class="text-lg font-bold">Hello!</h3>
                    <p class="py-4">Pesanan Berhasil Dibuat</p>
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button onclick="location.href='../../home_karyawan.html'" class="btn bg-white text-black hover:bg-blue-dark hover:text-white">OKE</button>
                        </form>
                    </div>
                </div>
            </dialog>
        </div>
    </div>
</body>
</html>
