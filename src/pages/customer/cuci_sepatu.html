<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../../styles/output.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="font-poppins relative min-h-screen bg-gradient-to-b from-blue-dark to-blue-light">
  <nav class="bg-blue-dark border-gray-200">
      <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
          <ul class="flex flex-row font-medium p-2 md:p-0 mt-1 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 ">
              <li>
              <a href="../../home_customer.html" class="block px-2 md:py-2 md:px-3 md:p-0 text-lg font-semibold text-white bg-blue-dark rounded hover:text-blue-light md:bg-transparent" aria-current="page">Beranda</a>
              </li>
              <li>
              <a href="../../account_customer.html" class="block px-2 md:py-2 md:px-3 md:p-0 text-lg font-semibold text-white rounded hover:bg-gray-100 hover:text-blue-light md:hover:bg-transparent">Akun Saya</a>
              </li>
          </ul>
          <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
              <button onclick="location.href='../../index.html'" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">Keluar</button>
          </div>
      </div>
  </nav>
    <!-- Section 1 -->
    <div class="max-w-4xl mx-auto px-4 py-8 text-black">
        <h1 class="text-4xl font-bold text-white mb-8">Cuci Sepatu</h1>

        <!-- {/* Profile Form Card */} -->
        <form class="bg-white rounded-xl shadow-lg p-6 mb-8" action="#">
          <div class="space-y-6">
            <!-- {/* Weight Field */} -->
            <div>
                <label class="block text-2xl text-center font-medium text-gray-800 mb-4">
                  Berat (Kg)
                </label>
                <input 
                  type="number" 
                  class="w-full bg-white border-0 rounded-xl shadow-lg p-4 text-center text-lg"
                  placeholder="Enter weight"
                />
            </div>
            <!-- Add Item -->
            <div>
                <label class="block text-2xl text-center font-medium text-gray-800 mb-4">
                  Tambah Barang
                </label>
                <button class="w-full bg-white border-0 rounded-xl shadow-lg p-4 flex items-center justify-center">
                  <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                  </svg>
                </button>
            </div>
            <!-- Perfume Selection -->
            <div class="space-y-2">
                <p class="text-lg font-medium">Parfum:</p>
                <div class="grid grid-cols-3 gap-4">
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="perfume" class="w-4 h-4" />
                    <span>Akasia</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="perfume" class="w-4 h-4" />
                    <span>Molto</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="perfume" class="w-4 h-4" />
                    <span>Kispray</span>
                  </label>
                </div>
            </div>

            <!-- Duration Selection -->
            <div class="space-y-2">
                <p class="text-lg font-medium">Durasi:</p>
                <div class="grid grid-cols-3 gap-4">
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="duration" class="w-4 h-4" />
                    <span>1 Day</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="duration" class="w-4 h-4" />
                    <span>2 Day</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="radio" name="duration" class="w-4 h-4" />
                    <span>3 Day</span>
                  </label>
                </div>
            </div>    

            <!-- Address -->
            <div class="space-y-2">
                <p class="text-lg text-blue-500 font-medium">Alamat</p>
                <input 
                  type="text" 
                  class="w-full bg-transparent rounded-xl border-b border-gray-400 p-2"
                  defaultValue="Jalan Ahmad Yani No. 92"
                />
            </div>

            <!-- Schedule -->
            <div class="space-y-4">
                <p class="text-lg text-blue-500 font-medium">Jadwal Pengambilan</p>
                <div class="grid grid-cols-2 gap-6">
                  <div class="bg-white rounded-xl p-4">
                    <p class="text-gray-500 mb-2">Tanggal Pengambilan</p>
                    <div class="flex items-center space-x-2">
                        <div class="relative max-w-sm">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                                </svg>
                            </div>
                            <input datepicker id="default-datepicker" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Pilih tanggal">
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4">
                    <p class="text-gray-500 mb-2">Tanggal Pengantaran</p>
                    <div class="flex items-center space-x-2">
                        <div class="relative max-w-sm">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                                </svg>
                            </div>
                            <input datepicker id="default" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Pilih tanggal">
                        </div>
                    </div>
                  </div>
                </div>
            </div>
            
          <!-- {/* Action Buttons */} -->
          <div class="space-y-4 mt-4">
            <button type="button" data-modal-target="static-modal" data-modal-toggle="static-modal" class="w-full bg-blue-500 text-white py-4 rounded-xl font-medium hover:bg-blue-600 transition-colors">
              Kirim
            </button>
            <p class="text-center text-gray-600 italic">
                Note : Pastikan Semua Sudah Terisi dengan Benar
            </p>
          </div>
        </form>

        <div id="static-modal" data-modal-backdrop="static" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-2xl max-h-full">
                <!-- Modal content -->
                <div class="relative bg-white rounded-lg shadow">
                     <!-- Modal header -->
                    <!-- Modal body -->
                    <div class="p-4 md:p-5 space-y-4">
                        <p class="text-base leading-relaxed text-gray-500 ">
                            Lanjutkan Pembayaran?
                        </p>
                    </div>
                    <!-- Modal footer -->
                    <div class="flex items-center space-x-2 p-4 md:p-5 border-t border-gray-200 rounded-b ">
                        <button data-modal-hide="static-modal" type="button" class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 ">Tidak</button>
                        <button onclick="location.href='../../metode_pembayaran.html'" data-modal-hide="static-modal" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Ya</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="delete-account" data-modal-backdrop="static" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-2xl max-h-full">
                <!-- Modal content -->
                <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                    <!-- Modal header -->
                    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                            Hapus Akun ?
                        </h3>
                        <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="delete-account">
                            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                            </svg>
                            <span class="sr-only">Close modal</span>
                        </button>
                    </div>
                    <!-- Modal footer -->
                    <div class="flex justify-center items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
                        <button data-modal-hide="delete-account" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Batal</button>
                        <button data-modal-hide="delete-account" type="button" class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">Ya</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- askdbj -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</body>
</html>
